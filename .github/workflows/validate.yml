name: Validate game

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: gameplay
            mode: coop
            group: core
          - suite: gameplay
            mode: coop
            group: recent
          - suite: gameplay
            mode: coop
            group: legacy
          - suite: gameplay
            mode: coop
            group: classes
          - suite: gameplay
            mode: coop
            group: world
          - suite: regressions
            mode: coop
          - suite: board
            mode: coop
          - suite: render
            mode: coop
          - suite: network
            mode: coop
          - suite: network
            mode: ffa
          - suite: network
            mode: teams
          - suite: network
            mode: fort
          - suite: network
            mode: mists
          - suite: network
            mode: bots
          - suite: network
            mode: ride
          - suite: network
            mode: commander
          - suite: network
            mode: botsffa
          - suite: network
            mode: room
          - suite: network
            mode: chariot
    steps:
      - uses: actions/checkout@v5
      - name: Install the project's Godot version
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "$archive" "$base/$archive"
          curl -fsSL --retry 3 -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep " $archive\$" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          rm "$archive" SHA512-SUMS.txt
      - uses: actions/setup-node@v5
        if: matrix.suite == 'board'
        with:
          node-version: "22"
      - name: Local copies of the leaderboard
        if: matrix.suite == 'board'
        run: npm ci --prefix server/leaderboard --no-audit --no-fund
      - name: Import all resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/checks
          python3 tools/import_project.py --log build/checks/import.log
      - name: Run checks with isolated saves
        if: matrix.suite != 'render'
        run: python3 tools/run_checks.py ${{ matrix.suite }} --mode ${{ matrix.mode }} --group "${{ matrix.group || 'all' }}"
      - name: Check development packaging
        if: matrix.suite == 'regressions'
        run: |
          python3 tools/check_production_build.py
          python3 -m unittest discover -s tests -p "test_*.py"
          python3 tools/run_checks.py rework
          python3 tools/run_checks.py features
      - name: Compile shaders and capture UI and weather
        if: matrix.suite == 'render'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          export XDG_DATA_HOME="$RUNNER_TEMP/visual-profile"
          export LIBGL_ALWAYS_SOFTWARE=1
          mkdir -p build/checks/screens
          for scene in weather_shots ui_shots rework_shots mist_review weapon_shots atmosphere_review village_review dev_feature_shots store_shots status_audit_shots; do
            timeout 180s xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT" --path . \
              --rendering-driver opengl3 --audio-driver Dummy "res://tests/$scene.tscn" \
              -- "$PWD/build/checks/screens" 2>&1 | tee "build/checks/$scene.log"
            if grep -E 'SCRIPT ERROR:|SHADER ERROR:|^ERROR:' "build/checks/$scene.log"; then exit 1; fi
          done
          test -f build/checks/screens/storm_warning.png
          test -f build/checks/screens/settings_pause.png
          test -f build/checks/screens/artillery_map.png
          test -f build/checks/screens/menu.png
          test -f build/checks/screens/mists_title.png
          test -f build/checks/screens/falls_pool.png
          test -f build/checks/screens/vanguard_first_person.png
          test -f build/checks/screens/village_aura.png
          test -f build/checks/screens/fort_aura.png
          test -f build/checks/screens/interior_Barn.png
          test -f build/checks/screens/watermill_repaired.png
          test -f build/checks/screens/finale_outer_storms.png
          test -f build/checks/screens/gate_cost_outside.png
          test -f build/checks/screens/snake_bite.png
          test -f build/checks/screens/warlord_faultline.png
          test -f build/checks/screens/gate_cost_angle.png
          test -f build/checks/screens/together_hud.png
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: checks-${{ matrix.suite }}-${{ matrix.mode }}-${{ matrix.group || 'all' }}
          path: build/checks
          retention-days: 14
