name: iOS build

# Builds an unsigned iPhone app on one of GitHub's Macs. Sign and install it with Sideloadly and a
# free Apple ID: see docs/BUILDING.md.
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.7.2"

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Fetch Godot and its export templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz -d "$RUNNER_TEMP/tpz"
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          mv "$RUNNER_TEMP"/tpz/templates/* "$dest/"
          rm godot.zip templates.tpz
          echo "GODOT=$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Add online play
        env:
          GH_TOKEN: ${{ github.token }}
          EPIC_PRODUCT_ID: ${{ secrets.EPIC_PRODUCT_ID }}
          EPIC_SANDBOX_ID: ${{ secrets.EPIC_SANDBOX_ID }}
          EPIC_DEPLOYMENT_ID: ${{ secrets.EPIC_DEPLOYMENT_ID }}
          EPIC_CLIENT_ID: ${{ secrets.EPIC_CLIENT_ID }}
          EPIC_CLIENT_SECRET: ${{ secrets.EPIC_CLIENT_SECRET }}
        run: |
          plugin=3ddelano/epic-online-services-godot
          tag=$(gh api "repos/$plugin/releases" --jq '[.[] | select(.assets[].name | contains("56238973"))][0].tag_name')
          gh release download "$tag" --repo "$plugin" --pattern '*-all-56238973*' --output plugin.zip
          unzip -q plugin.zip -d "$RUNNER_TEMP/plugin"
          rm plugin.zip
          python3 tools/setup_epic.py "$(dirname "$(find "$RUNNER_TEMP/plugin" -name eosg.gdextension | head -1)")" ios,macos

      - name: Are the Epic keys there
        run: test -f scripts/epic_keys.gd

      - name: Export the Xcode project
        run: |
          mkdir -p build/ios
          "$GODOT" --headless --path . --import 2>&1 | tee build/import.log
          ! grep -E 'SCRIPT ERROR:|SHADER ERROR:|^ERROR:' build/import.log
          "$GODOT" --headless --path . --export-release iOS build/ios/botti.ipa 2>&1 | tee build/ios-export.log | tail -20
          test -d build/ios/botti.xcodeproj

      - name: Build the app, unsigned
        run: |
          cd build/ios
          xcodebuild archive -project botti.xcodeproj -scheme botti -archivePath botti.xcarchive \
            -destination "generic/platform=iOS" -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" 2>&1 \
            | tee ../xcode.log | tail -30
          mkdir Payload
          cp -R botti.xcarchive/Products/Applications/*.app Payload/
          zip -qry "$GITHUB_WORKSPACE/botti-last-stand-ios.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/botti-last-stand-ios.ipa"

      - uses: actions/upload-artifact@v6
        with:
          name: botti-last-stand-ios
          path: botti-last-stand-ios.ipa
          retention-days: 30

      # The iPhone app goes on the version's release too, next to the Android one, so it is easy to find.
      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          awk 'BEGIN{n=0} /^## /{n++} n==1' CHANGELOG.md > notes.md
          gh release view "v$v" > /dev/null 2>&1 || gh release create "v$v" --target "$GITHUB_SHA" --title "Botti's Last Stand $v" --notes-file notes.md || true
          cp botti-last-stand-ios.ipa "botti-last-stand-$v-ios.ipa"
          gh release upload "v$v" "botti-last-stand-$v-ios.ipa" --clobber
